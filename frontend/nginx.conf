# All traffic arrives via the Cloudflare Tunnel (cloudflared connects
# locally on the host), so $remote_addr is always the same address for
# every visitor — rate-limiting on it would throttle the whole site as one
# client. CF-Connecting-IP is set authoritatively by Cloudflare's edge on
# every request, so key the zones on that instead (falling back to
# $remote_addr only if it's ever missing, e.g. a direct Tailscale hit).
map $http_cf_connecting_ip $rate_limit_key {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

limit_req_zone $rate_limit_key zone=api_general:10m rate=10r/s;
limit_req_zone $rate_limit_key zone=api_login:10m rate=5r/m;

server {
    # Published on 127.0.0.1 and the host's Tailscale IP (see
    # docker-compose.prod.yml) — never 0.0.0.0, so this stays unreachable
    # from the wider LAN/internet. The host's cloudflared service routes
    # the public hostname to localhost:8445, with "No TLS Verify" enabled
    # since this cert isn't from a publicly trusted CA (see DEPLOY.md).
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost 100.103.213.104;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Docker's embedded DNS, needed because proxy_pass below resolves
    # "app" at request time via a variable rather than once at config
    # load (see the comment on the /api/ location block).
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    limit_req_status 429;
    client_max_body_size 1m;

    # nginx gotcha: add_header in a location block is NOT merged with
    # add_header directives from the server block — if a location defines
    # even one, none of the parent's are inherited. So every security
    # header below is repeated in both location blocks rather than
    # declared once here.

    # Same rationale as the API's helmet config: script-src/style-src stay
    # 'self'-only (the app bundle is an external file, no inline <script>),
    # connect-src stays open to any https/http origin because VITE_API_URL
    # is a build-time setting that can point at a different host:port than
    # the page itself — a same-origin-only connect-src would just break
    # every fetch() call. img-src allows the thumbnail CDNs the playlist
    # preview renders (YouTube/Vimeo/Dailymotion), not just our own origin.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: http:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # index.html has no fingerprint: it must always be revalidated, or
    # browsers can keep serving a stale app shell (pointing at JS bundles
    # that no longer exist on disk after a redeploy) via heuristic caching.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: http:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # $upstream_app is resolved at request time (via Docker's embedded DNS,
    # 127.0.0.11) rather than once when nginx parses this config — see the
    # azwebsite/MyPortfolio compose notes for the restart-loop this avoids
    # after a host reboot.
    #
    # proxy_buffering/proxy_request_buffering are off and proxy_http_version
    # is 1.1: the app streams downloads end-to-end (yt-dlp stdout -> HTTP
    # response, chunked, unknown Content-Length — see src/routes/download.js)
    # as part of its zero-disk architecture. Nginx's default buffering mode
    # would spool the whole response to memory/disk before forwarding it,
    # which defeats that design and also delays the first byte to the
    # client on multi-GB playlists. Long timeouts because a slow client or
    # a large playlist zip can legitimately run for a while.
    location = /api/auth/login {
        limit_req zone=api_login burst=3 nodelay;
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
